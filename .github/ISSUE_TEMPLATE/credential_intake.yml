name: "Certification Intake"
description: "Submit a new or updated certification / credential"
title: "[CREDENTIAL]: "
labels: ["intake:credential"]
body:
  - type: dropdown
    id: action
    attributes:
      label: "Action"
      options:
        - "Create"
        - "Update"
      default: 0
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: "Certification Title"
      placeholder: "e.g. AWS Solutions Architect Associate"
    validations:
      required: true
  - type: input
    id: issuer
    attributes:
      label: "Issuer / Organization"
      placeholder: "e.g. Amazon Web Services"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: "Simple Icons Slug (Optional)"
      placeholder: "e.g. amazonwebservices"
    validations:
      required: false
  - type: input
    id: color
    attributes:
      label: "Brand Hex Color (Optional)"
      placeholder: "e.g. FF9900"
    validations:
      required: false
