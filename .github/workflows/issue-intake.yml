name: Portfolio Issue Intake Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  process-intake:
    name: Process Issue Intake
    environment: Production
    # Safest Multi-Layer Owner Security Gate
    if: github.event.issue.author_association == 'OWNER' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Issue Parser Engine
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/parse-issue.js

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(intake): update portfolio dataset from issue #${{ github.event.issue.number }}"
          branch: "intake/issue-${{ github.event.issue.number }}"
          title: "intake: dataset update for issue #${{ github.event.issue.number }}"
          body: |
            Automated issue intake update triggered by @${{ github.actor }}.
            
            Closes #${{ github.event.issue.number }}
          labels: "intake:automated"

      - name: Comment PR Link on Issue
        if: success() && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_NUM: ${{ steps.cpr.outputs.pull-request-number }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "🚀 **Automated Intake Update:** Generated PR [#${PR_NUM}](${PR_URL}) to review and apply the dataset changes."

      - name: Comment Failure on Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          gh issue comment "$ISSUE_NUM" --body "❌ **Automated Intake Failed:** The intake parser workflow encountered an error while processing this issue. [View Workflow Run Logs](${RUN_URL})"


